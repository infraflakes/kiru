name: kiru release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build Kiru Static Binary via Docker
        run: |
          docker build --target bin --output type=local,dest=bin .

      - name: Package and Checksum
        run: |
          cd bin
          NAME="kiru-${{ github.ref_name }}-linux-x86_64"
          mv kiru "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"

      - name: Generate release notes from commits
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -z "$PREV" ]; then
            RANGE="$(git rev-list --max-parents=0 HEAD)..HEAD"
          else
            RANGE="$PREV..HEAD"
          fi
          {
            echo "## What's Changed"
            echo
            git log "$RANGE" --no-merges --pretty="- %s (%h)"
          } > notes.md
          cat notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*
          body_path: notes.md
          draft: false
          prerelease: false
