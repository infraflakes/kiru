name: CI Nix

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'stdlib/**'
      - '.kiru/**'
      - 'entry.kiru'
      - 'main.kiru'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**.nix'
      - 'flake.lock'
      - '.github/workflows/ci-nix.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'stdlib/**'
      - '.kiru/**'
      - 'entry.kiru'
      - 'main.kiru'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '**.nix'
      - 'flake.lock'
      - '.github/workflows/ci-nix.yml'

permissions:
  contents: read

concurrency:
  group: ci-nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check the flake
        run: nix flake check -L

      - name: Build the compiler
        run: nix build .#default

      - name: Compile the pipeline
        run: ./result/bin/kc main.kiru

      - name: Checking the codebase
        run: |
          ./main kiru check
