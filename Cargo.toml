[package]
name = "kiru"
version = "0.4.0"
edition = "2024"
license = "MIT"
authors = ["Nguyen Bao Truong <infraflakes@proton.me>"]

[[bin]]
name = "kc"
path = "src/main.rs"

[dependencies]
nix = { version = "0.31.3", features = ["fs", "process", "signal"] }
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", features = ["alloc"] }
unicode-width = "0.2.2"
tower-lsp-server = "0.23.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
tower = "0.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
