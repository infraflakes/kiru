[package]
name = "kiru"
version = "0.4.0"
edition = "2024"
license = "MIT"
authors = ["Nguyen Bao Truong <infraflakes@proton.me>"]

[[bin]]
name = "kc"
path = "src/main.rs"

[dependencies]
nix = { version = "0.31.3", features = ["fs", "process", "signal"] }
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", features = ["alloc"] }
glob = "0.3.3"
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
