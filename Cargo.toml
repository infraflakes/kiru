[package]
name = "kiru"
version = "0.4.0"
edition = "2024"
license = "MIT"
authors = ["Nguyen Bao Truong <infraflakes@proton.me>"]

[[bin]]
name = "kc"
path = "src/main.rs"

[dependencies]
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", features = ["alloc"] }

[dev-dependencies]
tempfile = "3.27.0"
