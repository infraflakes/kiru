[package]
name = "kiru"
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["Nguyen Bao Truong <infraflakes@proton.me>"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
dirs = "6.0.0"
miette = { version = "7.6", features = ["fancy"] }
ratatui = "0.30.2"
shlex = "2.0.1"
thiserror = "2.0.19"
tokio = { version = "1.53", default-features = false, features = ["rt-multi-thread", "sync", "time"] }

[build-dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"

[dev-dependencies]
tempfile = "3.27"

[dependencies.crossterm]
version = "0.29"
features = ["event-stream"]
