[package]
name = "kiru"
version = "0.0.1"
edition = "2024"
license = "MIT"
authors = ["Nguyen Bao Truong <infraflakes@proton.me>"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
dirs = "6.0.0"
miette = { version = "7.6", features = ["fancy"] }
ratatui = "0.30.0"
shlex = "2.0.1"
thiserror = "2.0.18"
tokio = { version = "1.52", features = ["rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = "3.27"

[dependencies.crossterm]
version = "0.29"
default-features = false
features = ["event-stream"]


