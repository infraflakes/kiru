# Cargo behavior that is the same in every environment. The build target and
# its static-link flag belong to the flake (`flake.nix`), so a plain `cargo`
# outside the flake builds for the host.

[alias]
# Release build of the compiler.
br = "build --release"
# The two checks the pipeline runs, with the same flags.
cl = "clippy --all-targets -- -D warnings"
fc = "fmt --check"

[net]
# Fetch git dependencies with the system git. It is more robust than cargo's
# built-in fetch in CI and in sandboxes.
git-fetch-with-cli = true
